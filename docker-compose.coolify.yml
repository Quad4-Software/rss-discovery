name: rss-discovery

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  rss-discovery-init:
    image: alpine:3.23@sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0
    restart: "no"
    exclude_from_hc: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "rss-discovery-init: preparing /data for uid 65532"
        mkdir -p /data/seeds
        chown -R 65532:65532 /data
        echo "rss-discovery-init: rendering /config/config.toml"
        cat > /config/config.toml <<'TOML'
        data_dir = "/data"
        db_path = "/data/rss.duckdb"
        seed_dir = "/data/seeds"
        landlock = false

        [server]
        addr = "0.0.0.0:8787"
        read_timeout_sec = 15
        read_header_timeout_sec = 5
        write_timeout_sec = 30
        idle_timeout_sec = 60
        body_limit = "4M"
        max_header_bytes = 65536
        max_concurrent = 4096
        max_conn_per_ip = 64

        [workers]
        fetch_workers = 8
        extract_workers = 4
        queue_size = 2048
        http_timeout_sec = 20
        http_max_idle = 64
        user_agent = "Mozilla/5.0 (compatible; rss-discovery/1.0; +https://github.com/Quad4-Software/rss-discovery)"
        max_feed_bytes = 5242880
        max_article_bytes = 2097152
        concurrency_per_host = 2
        requests_per_host_per_min = 30
        min_host_gap_ms = 200

        [limits]
        max_total_bytes = 1073741824
        max_entries_per_feed = 200
        max_fulltext_bytes = 524288000
        entry_ttl_hours = 720
        fulltext_ttl_hours = 336
        favicon_ttl_hours = 2160
        purge_interval_min = 15
        purge_batch = 5000

        [s3]
        enabled = false
        bucket = ""
        prefix = "rss-discovery/"
        region = "garage"
        endpoint = ""
        force_path_style = true
        access_key = ""
        secret_key = ""

        [search]
        fts_enabled = true
        similarity_min = 0.25
        default_limit = 25
        max_limit = 100

        [auth]
        required = true
        header = "Authorization"
        query_param = "api_key"
        allow_anonymous_health = true
        public_rate_per_min = 60
        public_burst = 10
        authed_reserved_concurrent = 1024
        public_max_conn_per_ip = 8

        [observability]
        log_file = "/data/rss-discovery.log"
        log_level = "info"
        sentry_dsn = ""
        sentry_env = "production"
        privacy_mode = true
        otlp_endpoint = ""
        access_log = true

        [security]
        maintenance = false
        block_probes = true
        block_scanners = true
        block_scrapers = true
        trust_proxy = true
        require_user_agent = true
        blocklist_file = "/app/data/blocklist.txt"
        blocklist_url = ""
        blocklist_reload_min = 15
        validate_upstream_url = true

        [metrics]
        addr = "127.0.0.1:8788"
        path = "/metrics"
        auth_token = ""
        require_auth = true

        [cors]
        enabled = true
        allow_origins = ["*"]
        allow_headers = ["Authorization", "Content-Type", "X-API-Key", "If-None-Match", "If-Modified-Since"]
        allow_methods = ["GET", "POST", "DELETE", "OPTIONS", "HEAD"]
        allow_credentials = false
        max_age_sec = 600

        [oauth]
        enabled = true
        token_ttl_sec = 3600
        default_level = "standard"

        [websub]
        enabled = true
        callback_url = "${RSS_DISCOVERY_PUBLIC_URL:-}/v1/websub/callback"
        lease_seconds = 86400
        renew_ahead_sec = 3600

        [cache]
        cdn_enabled = true
        max_age_sec = 30
        stale_while_revalidate_sec = 60

        [freshness]
        slo_seconds = 3600
        TOML
        chmod 0644 /config/config.toml
        echo "rss-discovery-init: done"
    volumes:
      - rss_data:/data
      - rss_config:/config
    networks:
      - rss-discovery
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  rss-discovery:
    image: ${RSS_DISCOVERY_IMAGE:-ghcr.io/quad4-software/rss-discovery:latest}
    restart: unless-stopped
    user: "65532:65532"
    init: true
    depends_on:
      rss-discovery-init:
        condition: service_completed_successfully
    environment:
      - SERVICE_FQDN_RSS_DISCOVERY_8787
      - RSS_DISCOVERY_DATA_DIR=/data
      - RSS_DISCOVERY_DB_PATH=/data/rss.duckdb
      - RSS_DISCOVERY_SEED_DIR=/data/seeds
      - RSS_DISCOVERY_SERVER_ADDR=0.0.0.0:8787
      - RSS_DISCOVERY_METRICS_ADDR=127.0.0.1:8788
      - RSS_DISCOVERY_LANDLOCK=false
      - RSS_DISCOVERY_AUTH_REQUIRED=true
      - RSS_DISCOVERY_PRIVACY=true
      - RSS_DISCOVERY_METRICS_TOKEN=${SERVICE_PASSWORD_RSSMETRICSTOKEN:-}
      - RSS_DISCOVERY_S3_ENABLED=${RSS_DISCOVERY_S3_ENABLED:-false}
      - RSS_DISCOVERY_S3_BUCKET=${RSS_DISCOVERY_S3_BUCKET:-}
      - RSS_DISCOVERY_S3_PREFIX=${RSS_DISCOVERY_S3_PREFIX:-rss-discovery/}
      - RSS_DISCOVERY_S3_REGION=${RSS_DISCOVERY_S3_REGION:-garage}
      - RSS_DISCOVERY_S3_ENDPOINT=${RSS_DISCOVERY_S3_ENDPOINT:-}
      - RSS_DISCOVERY_S3_ACCESS_KEY=${RSS_DISCOVERY_S3_ACCESS_KEY:-}
      - RSS_DISCOVERY_S3_SECRET_KEY=${RSS_DISCOVERY_S3_SECRET_KEY:-}
      - TZ=${TZ:-UTC}
    expose:
      - "8787"
    volumes:
      - rss_data:/data
      - rss_config:/config:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - rss-discovery
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  rss_data:
  rss_config:

networks:
  rss-discovery:
    driver: bridge
