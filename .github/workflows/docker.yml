name: Docker

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
    paths:
      - Dockerfile
      - .dockerignore
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
      - data/blocklist.txt
      - config.example.toml
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image created time
        id: now
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            org.opencontainers.image.title=rss-discovery
            org.opencontainers.image.description=RSS aggregation and discovery API
            org.opencontainers.image.vendor=Quad4 Software
            org.opencontainers.image.licenses=0BSD
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            IMAGE_TITLE=rss-discovery
            IMAGE_DESCRIPTION=RSS aggregation and discovery API
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
            IMAGE_URL=https://github.com/${{ github.repository }}
            IMAGE_DOCUMENTATION=https://github.com/${{ github.repository }}
            IMAGE_VENDOR=Quad4 Software
            IMAGE_LICENSES=0BSD
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
            IMAGE_CREATED=${{ steps.now.outputs.created }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.images }}
        run: cosign sign --yes "$(printf '%s' "$IMAGE" | head -n 1)@${DIGEST}"
